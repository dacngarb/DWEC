<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="id1"></div>
    <button onclick="window.close()">Cerrar</button>
    <button onclick="window.open('ejemploWindow.html')">abrir</button>
    <button onclick="window.blur()">blur</button>

    <button onclick="parar()">Parar</button>
    <button onclick="iniciar()">Iniciar</button>
    <div id="id2"></div>
    <script>

        function escribirRandom(){
        document.getElementById("id2").innerHTML += "<br>" + Math.random();

        }
        intervalID = setInterval(escribirRandom,100)

        function parar(){

            window.clearInterval(intervalID);
            intervalID = null;
        }

        function iniciar(){
            if(intervalID === null)intervalID = setInterval(escribirRandom,100)

        }
    </script>
</body>
</html>
